<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Data 360</title>
<meta name="description" content="Enterprise Data 360: an interactive analytics dashboard covering banking, e-commerce, inventory, HR, marketing and customer data. Sample figures.">
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('ed360-theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  --page: #f4f7fb; --surface: #ffffff; --surface-2: #eef3f9;
  --ink: #0b1220; --ink-2: #465467; --muted: #7c8797;
  --grid: #e3e8ef; --axis: #c5ced9; --border: rgba(11,18,32,.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --de: #b9c3d0; --wash: rgba(42,120,214,.10);
  --o1: #86b6ef; --o2: #5598e7; --o3: #2a78d6; --o4: #1c5cab; --o5: #104281;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --good-text: #006300; --crit-text: #b02a2a; --warn-text: #7a5200;
  --accent: #2a78d6; --glow-a: rgba(42,120,214,.16); --glow-b: rgba(27,175,122,.12);
  --shadow: 0 1px 2px rgba(11,18,32,.05), 0 8px 24px rgba(11,18,32,.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0a0f17; --surface: #111926; --surface-2: #172232;
  --ink: #eef3f9; --ink-2: #b6c2d1; --muted: #8793a3;
  --grid: #1f2b3b; --axis: #2f3d50; --border: rgba(255,255,255,.09);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c;
  --de: #3a475a; --wash: rgba(57,135,229,.14);
  --o1: #9ec5f4; --o2: #6da7ec; --o3: #3987e5; --o4: #256abf; --o5: #184f95;
  --good-text: #3fc43f; --crit-text: #f08a8a; --warn-text: #fab219;
  --accent: #3987e5; --glow-a: rgba(57,135,229,.20); --glow-b: rgba(25,158,112,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); background: var(--page); color: var(--ink); line-height: 1.45; -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Soft moving colour behind the page */
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.backdrop i { position: absolute; border-radius: 50%; filter: blur(70px); }
.backdrop i:nth-child(1) { width: 46vw; height: 46vw; left: -12vw; top: -18vw; background: var(--glow-a); animation: drift 22s ease-in-out infinite alternate; }
.backdrop i:nth-child(2) { width: 40vw; height: 40vw; right: -10vw; top: 10vh; background: var(--glow-b); animation: drift 28s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translate(6vw, 8vh) scale(1.08); } }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 14px; padding: 12px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-right: auto; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--s1), var(--s3)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 14px var(--glow-a); }
.brand-mark svg { width: 18px; height: 18px; }
.pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search svg { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--wash); }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13.5px; font-weight: 600; transition: transform .12s, border-color .15s, background .15s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:focus-visible, .tab:focus-visible, .kpi:focus-visible, .seg-part:focus-visible, th button:focus-visible, .alert:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn svg { width: 16px; height: 16px; }
.btn.icon { padding: 8px; }

/* Tabs */
.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 10px 13px; border: 0; background: none; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; border-radius: 9px 9px 0 0; transition: color .15s, background .15s; }
.tab svg { width: 16px; height: 16px; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--accent); }
.tab-ink { position: absolute; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--accent); transition: left .32s cubic-bezier(.3,.8,.2,1), width .32s cubic-bezier(.3,.8,.2,1); }

/* Page head */
main { padding: 26px 0 60px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: clamp(24px, 3.4vw, 34px); letter-spacing: -.025em; margin: 0 0 4px; line-height: 1.12; }
.lede { margin: 0; color: var(--ink-2); max-width: 62ch; }
.rise { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .16s, border-color .16s; }
button.kpi { cursor: pointer; }
button.kpi:hover { transform: translateY(-3px); border-color: var(--accent); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .85; }
.kpi[data-tone="good"]::before { background: var(--good); }
.kpi[data-tone="warn"]::before { background: var(--warn); }
.kpi[data-tone="bad"]::before { background: var(--crit); }
.kpi-label { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.kpi-value { font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin: 3px 0 2px; }
.kpi-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.kpi-delta svg { width: 13px; height: 13px; }
.kpi-delta.good { color: var(--good-text); }
.kpi-delta.bad { color: var(--crit-text); }
.kpi-delta.warn { color: var(--warn-text); }
.kpi-go { position: absolute; right: 12px; top: 12px; color: var(--muted); opacity: 0; transition: opacity .15s, transform .15s; }
.kpi-go svg { width: 15px; height: 15px; }
button.kpi:hover .kpi-go { opacity: 1; transform: translateX(2px); }

/* Alerts */
.alerts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.alert { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 13.5px; font-weight: 600; text-align: left; }
button.alert { cursor: pointer; transition: transform .12s, border-color .15s; }
button.alert:hover { transform: translateY(-1px); border-color: var(--accent); }
.alert svg { width: 16px; height: 16px; flex: none; }
.alert.crit svg { color: var(--crit); } .alert.warn svg { color: var(--warn-text); } .alert.info svg { color: var(--accent); }

/* Cards and charts */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 16px 14px; box-shadow: var(--shadow); min-width: 0; transition: border-color .18s, transform .18s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card h2 { font-size: 15px; margin: 0; letter-spacing: -.005em; }
.card .sub { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 0; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: none; }
.toggle button { border: 0; background: none; padding: 5px 7px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.toggle button svg { width: 15px; height: 15px; }
.toggle button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); }
.plot { position: relative; }
.plot canvas { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; list-style: none; padding: 0; margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 4px; border-radius: 6px; cursor: pointer; color: inherit; }
.legend button:hover { background: var(--surface-2); }
.legend button[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sw.line { height: 3px; width: 14px; border-radius: 2px; }
.sw.dot { border-radius: 50%; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini th, .mini td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: left; }
.mini td.num, .mini th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mini-wrap { max-height: 300px; overflow: auto; }

/* Segmented bar */
.card { display: flex; flex-direction: column; }
.card > .body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.seg-lead { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.seg-lead b { display: block; font-size: 34px; letter-spacing: -.02em; color: var(--ink); line-height: 1.1; }
.seg { display: flex; gap: 2px; height: 28px; margin: 14px 0 4px; }
.seg-part { height: 100%; width: 0; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; font-size: 12.5px; font-weight: 700; color: #fff; overflow: visible; white-space: nowrap; transition: width .9s cubic-bezier(.2,.8,.2,1), filter .15s, transform .15s; cursor: default; }
.seg-part.dark-ink { color: #0b0b0b; }
.seg-part:hover, .seg-part:focus-visible { filter: brightness(1.12); transform: scaleY(1.12); }
.seg-note { font-size: 12.5px; color: var(--ink-2); margin: 10px 0 0; }

/* Tooltip for HTML marks */
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; box-shadow: var(--shadow); padding: 7px 10px; font-size: 12.5px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; font-size: 14px; }
.tip span { color: var(--ink-2); }

/* Data table */
.table-card { padding: 16px 0 6px; }
.table-card .card-head { padding: 0 16px; align-items: center; }
.count { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 600; padding: 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th button { width: 100%; display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 9px 16px; cursor: pointer; color: inherit; font-weight: 600; font-size: 12px; }
table.data th.num button { justify-content: flex-end; }
table.data th button:hover { color: var(--ink); }
table.data th svg { width: 12px; height: 12px; opacity: .35; transition: transform .2s, opacity .2s; }
table.data th[aria-sort="ascending"] svg { opacity: 1; color: var(--accent); }
table.data th[aria-sort="descending"] svg { opacity: 1; color: var(--accent); transform: rotate(180deg); }
table.data td { padding: 10px 16px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tbody tr { transition: background .12s; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data tbody tr:last-child td { border-bottom: 0; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); }
.badge svg { width: 12px; height: 12px; }
.badge.crit svg { color: var(--crit); } .badge.warn svg { color: var(--warn-text); } .badge.good svg { color: var(--good); }
mark { background: color-mix(in srgb, var(--warn) 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.empty { padding: 26px 16px; color: var(--ink-2); text-align: center; }
.results a { display: block; padding: 10px 16px; border-bottom: 1px solid var(--grid); text-decoration: none; color: var(--ink); }
.results a:hover { background: var(--surface-2); }
.results small { color: var(--ink-2); display: block; }

footer { color: var(--ink-2); font-size: 12.5px; padding: 0 0 40px; }
.view { transition: opacity .18s; }
.view.out { opacity: 0; }

@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-value { font-size: 23px; }
  .brand span.name { display: none; }
  .btn .txt { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i></div>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/></svg></span>
        <span class="name">Enterprise Data 360</span>
        <span class="pill" title="The figures on this dashboard are sample data for demonstration.">Sample data</span>
      </div>
      <label class="search">
        <span class="sr-only">Search the tables</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search IDs, categories, platforms" autocomplete="off">
      </label>
      <button class="btn" id="export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span class="txt">Export CSV</span></button>
      <button class="btn icon" id="theme" type="button" aria-label="Switch between light and dark theme"></button>

    <div class="tabs" id="tabs" role="tablist" aria-label="Dashboard sections"><span class="tab-ink" id="ink"></span></div>
  </div>
</header>

<main class="wrap"><div class="view" id="view" role="tabpanel" tabindex="-1"></div></main>
<footer class="wrap">Sample figures for demonstration, not real company data. Part of the <a href="https://github.com/HusseinHany/Data-Analysis-Project">Data Analysis graduation project</a>.</footer>
<div class="tip" id="tip" role="status"></div>

<script>
'use strict';
/* ---------- Icons ---------- */
const ICON = {
  overview: '<path d="M4 5h7v6H4zM13 5h7v4h-7zM13 11h7v8h-7zM4 13h7v6H4z"/>',
  banking: '<path d="M3 10 12 4l9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  ecommerce: '<path d="M4 5h2l2.2 10h9.6L20 8H7.2"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>',
  inventory: '<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/>',
  hr: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5M16 5.2a3.2 3.2 0 0 1 0 5.6M18 15.4c1.6.7 2.6 2.2 3 4.6"/>',
  marketing: '<path d="M4 10v4h3l8 4V6l-8 4zM18.5 9a4 4 0 0 1 0 6"/>',
  customer360: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  up: '<path d="M12 19V5m0 0-6 6m6-6 6 6"/>', down: '<path d="M12 5v14m0 0-6-6m6 6 6-6"/>', flat: '<path d="M5 12h14"/>',
  go: '<path d="M5 12h14m0 0-5-5m5 5-5 5"/>', alert: '<path d="M12 4 2.5 20h19zM12 10v4.5M12 17.4v.1"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.1"/>', check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.8 2.8L16 9.6"/>',
  chart: '<path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/>', table: '<path d="M4 6h16v12H4zM4 10.5h16M4 14.5h16M10 6v12"/>',
  sort: '<path d="M12 6v12m0-12-4 4m4-4 4 4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.2 5.2 7 7M17 17l1.8 1.8M18.8 5.2 17 7M7 17l-1.8 1.8"/>',
  moon: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7.5 7.5 0 1 0 20 14.5z"/>'
};
const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;

/* ---------- Helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmt(v, f = {}) {
  const d = f.d ?? 0;
  return (f.p || '') + Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) + (f.s || '');
}
// Fixed-seed random numbers, so the scatter samples look the same on every visit.
function seeded(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function cloud(seed, n, x0, xr, y0, yr) { const r = seeded(seed); return Array.from({ length: n }, () => ({ x: Math.round(r() * xr + x0), y: Math.round(r() * yr + y0) })); }
const index100 = (arr) => arr.map((v) => Math.round(v / arr[0] * 1000) / 10);

/* ---------- Data (sample figures) ---------- */

/* ---------- State ---------- */
const state = { tab: 'overview', q: '', sort: null, charts: [] };
const cellText = (c) => (c && typeof c === 'object' ? c.text : String(c));
function numeric(text) {
  const m = String(text).replace(/,/g, '').match(/-?\d+(\.\d+)?/);
  if (!m) return NaN;
  const mult = /M\b/.test(text) ? 1e6 : /K\b/.test(text) ? 1e3 : 1;
  return parseFloat(m[0]) * mult;
}

/* ---------- Tooltip for HTML marks ---------- */
const tip = $('#tip');
function showTip(target, title, sub, ev) {
  tip.replaceChildren(h('b', {}, title), h('span', {}, sub));
  const r = target.getBoundingClientRect();
  const x = ev && ev.clientX ? ev.clientX : r.left + r.width / 2;
  tip.classList.add('on');
  const w = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
  tip.style.top = Math.max(8, r.top - tip.offsetHeight - 10) + 'px';
}
const hideTip = () => tip.classList.remove('on');

/* ---------- Chart.js setup ---------- */
function theme() {
  return { ink: css('--ink'), ink2: css('--ink-2'), muted: css('--muted'), grid: css('--grid'), axis: css('--axis'), surface: css('--surface'), border: css('--border'),
    s1: css('--s1'), s2: css('--s2'), de: css('--de'), wash: css('--wash'), crit: css('--crit'), ordinal: ['--o1', '--o2', '--o3', '--o4', '--o5'].map(css) };
}
// Value labels at the end of bars, drawn in text colour (never the bar colour).
const valueLabels = {
  id: 'valueLabels',
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.show) return;
    const { ctx } = chart; const t = theme();
    ctx.save(); ctx.font = '600 11.5px ' + css('--font'); ctx.fillStyle = t.ink2; ctx.textBaseline = 'middle';
    chart.getDatasetMeta(0).data.forEach((bar, i) => {
      const text = fmt(chart.data.datasets[0].data[i], opts.f);
      if (opts.horizontal) { ctx.textAlign = 'left'; ctx.fillText(text, bar.x + 6, bar.y); }
      else { ctx.textAlign = 'center'; ctx.fillText(text, bar.x, bar.y - 9); }
    });
    ctx.restore();
  }
};
// A vertical hairline that follows the pointer on line charts.
const crosshair = {
  id: 'crosshair',
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.show) return;
    const active = chart.tooltip && chart.tooltip.getActiveElements();
    if (!active || !active.length) return;
    const { ctx, chartArea } = chart; const x = active[0].element.x;
    ctx.save(); ctx.strokeStyle = theme().axis; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke(); ctx.restore();
  }
};
// The latest value written at the end of each line.
const endLabels = {
  id: 'endLabels',
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.show) return;
    const { ctx } = chart; const t = theme();
    ctx.save(); ctx.font = '700 12px ' + css('--font'); ctx.fillStyle = t.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    chart.data.datasets.forEach((ds, i) => {
      const meta = chart.getDatasetMeta(i); if (meta.hidden) return;
      const p = meta.data[meta.data.length - 1]; if (!p) return;
      ctx.fillText(fmt(ds.data[ds.data.length - 1], opts.f), p.x + 8, p.y);
    });
    ctx.restore();
  }
};
Chart.register(valueLabels, crosshair, endLabels);

function baseOptions(t, f) {
  return {
    responsive: true, maintainAspectRatio: false,
    animation: reduceMotion ? false : { duration: 850, easing: 'easeOutQuart', delay: (c) => (c.type === 'data' && c.mode === 'default' ? c.dataIndex * 40 : 0) },
    interaction: { mode: 'index', intersect: false },

/* ---------- Data table with sort and search ---------- */
function highlight(text, q) {

}
function visibleRows(table) {

function searchResults() {
